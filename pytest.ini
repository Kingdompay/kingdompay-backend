[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --strict-markers
    --disable-warnings
    --tb=short
    -v
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    wallet: Wallet tests
    ledger: Ledger service tests
    models: Model tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
