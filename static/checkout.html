<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KingdomPay - Secure Checkout</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .checkout-container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #667eea;
            font-size: 2rem;
        }

        .campaign-info {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .campaign-info h2 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        .amount-display {
            font-size: 3rem;
            font-weight: bold;
            color: #667eea;
            margin: 20px 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #4a5568;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .provider-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .provider-btn {
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            font-weight: 600;
        }

        .provider-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .provider-btn.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .message.success {
            background: #c6f6d5;
            color: #22543d;
        }

        .message.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .message.info {
            background: #bee3f8;
            color: #2c5282;
        }

        .security-badge {
            text-align: center;
            margin-top: 30px;
            color: #718096;
            font-size: 0.9rem;
        }

        .security-badge i {
            color: #48bb78;
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <div class="checkout-container">
        <div class="logo">
            <h1><i class="fas fa-crown"></i> KingdomPay</h1>
        </div>

        {% if campaign %}
        <div class="campaign-info">
            <h2>{{ campaign.title }}</h2>
            <p style="color: #718096;">{{ campaign.type }}</p>
        </div>
        {% endif %}

        <div class="amount-display">
            KES {{ "%.2f"|format(amount) }}
        </div>

        {% if memo %}
        <div style="text-align: center; color: #718096; margin-bottom: 20px;">
            {{ memo }}
        </div>
        {% endif %}

        <div id="message-container"></div>

        <form id="checkout-form">
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="254712345678" required />
            </div>

            <div class="form-group">
                <label>Payment Method</label>
                <div class="provider-buttons">
                    {% for provider in providers %}
                    <div class="provider-btn" data-provider="{{ provider }}" onclick="selectProvider('{{ provider }}')">
                        {{ provider }}
                    </div>
                    {% endfor %}
                </div>
                <input type="hidden" id="provider" name="provider" value="MPESA" required />
            </div>

            <button type="submit" class="submit-btn" id="submit-btn">
                <i class="fas fa-lock"></i> Pay Securely
            </button>
        </form>

        <div class="security-badge">
            <i class="fas fa-shield-alt"></i>
            Secure payment powered by KingdomPay
        </div>
    </div>

    <script>
        let selectedProvider = 'MPESA';

        function selectProvider(provider) {
            selectedProvider = provider;
            document.querySelectorAll('.provider-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelector(`[data-provider="${provider}"]`).classList.add('active');
            document.getElementById('provider').value = provider;
        }

        // Set default provider
        document.addEventListener('DOMContentLoaded', () => {
            selectProvider('MPESA');
        });

        document.getElementById('checkout-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';

            const formData = {
                phone: document.getElementById('phone').value,
                provider: selectedProvider,
                amount: {{ amount }},
                memo: '{{ memo }}',
                {% if campaign %}
                campaign_id: {{ campaign.id }},
                {% endif %}
                checkout_id: '{{ checkout_id }}'
            };

            try {
                const response = await fetch('/api/v1/checkout/initiate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                const messageContainer = document.getElementById('message-container');
                
                if (data.success) {
                    messageContainer.innerHTML = `
                        <div class="message info">
                            <i class="fas fa-info-circle"></i>
                            ${data.message || 'Payment initiated! Check your phone for the prompt.'}
                        </div>
                    `;
                    submitBtn.innerHTML = '<i class="fas fa-check"></i> Payment Initiated';
                } else {
                    messageContainer.innerHTML = `
                        <div class="message error">
                            <i class="fas fa-exclamation-circle"></i>
                            ${data.message || 'Payment failed. Please try again.'}
                        </div>
                    `;
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-lock"></i> Pay Securely';
                }
            } catch (error) {
                document.getElementById('message-container').innerHTML = `
                    <div class="message error">
                        <i class="fas fa-exclamation-circle"></i>
                        An error occurred. Please try again.
                    </div>
                `;
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-lock"></i> Pay Securely';
            }
        });
    </script>
</body>
</html>
