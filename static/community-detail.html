<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KingdomPay - Community Details</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .nav-menu {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 20px;
        padding: 20px;
        margin-bottom: 30px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 15px;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        padding: 12px 20px;
        border-radius: 15px;
        text-decoration: none;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .nav-link:hover {
        transform: translateY(-3px);
      }

      .content-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
      }

      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        transition: all 0.3s ease;
        margin: 5px;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
      }

      .btn-secondary {
        background: #718096;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(5px);
      }

      .modal-content {
        background: white;
        margin: 10% auto;
        padding: 30px;
        border-radius: 20px;
        max-width: 500px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #2d3748;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #e2e8f0;
        border-radius: 10px;
        font-size: 1rem;
        transition: border-color 0.3s ease;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #667eea;
      }

      .message {
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 20px;
      }

      .message.success {
        background: #c6f6d5;
        color: #22543d;
        border: 1px solid #9ae6b4;
      }

      .message.error {
        background: #fed7d7;
        color: #742a2a;
        border: 1px solid #fc8181;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 20px 0;
      }

      .stat-card {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
      }

      .stat-card .stat-value {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 5px;
      }

      .stat-card .stat-label {
        font-size: 0.9rem;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="fas fa-users"></i> Community Details</h1>
        <p id="communityName">Loading...</p>
      </div>

      <div class="nav-menu">
        <a href="/static/index.html" class="nav-link">
          <i class="fas fa-home"></i> Dashboard
        </a>
        <a href="/static/communities.html" class="nav-link">
          <i class="fas fa-users"></i> Communities
        </a>
        <a href="/static/wallet.html" class="nav-link">
          <i class="fas fa-wallet"></i> Wallet
        </a>
      </div>

      <div class="content-card">
        <div id="message" class="message" style="display: none"></div>

        <div class="stats-grid" id="statsGrid">
          <!-- Stats will be loaded here -->
        </div>

        <div style="margin-top: 30px;">
          <h2 style="margin-bottom: 20px; color: #2d3748;">
            <i class="fas fa-hand-holding-heart"></i> Make a Contribution
          </h2>
          <button class="btn" onclick="openContributeModal()">
            <i class="fas fa-plus"></i> Contribute to Community
          </button>
          <a id="campaignsLink" href="#" class="btn btn-secondary">
            <i class="fas fa-bullhorn"></i> View Campaigns
          </a>
        </div>

        <div style="margin-top: 30px;">
          <h2 style="margin-bottom: 20px; color: #2d3748;">
            <i class="fas fa-history"></i> Recent Contributions
          </h2>
          <div id="contributionsList">
            <p style="color: #718096; text-align: center; padding: 20px;">
              Loading contributions...
            </p>
          </div>
        </div>
      </div>
    </div>

    <!-- Contribute Modal -->
    <div id="contributeModal" class="modal">
      <div class="modal-content">
        <h2 style="margin-bottom: 20px;">
          <i class="fas fa-hand-holding-heart"></i> Make Contribution
        </h2>
        <div id="contributeMessage" class="message" style="display: none"></div>
        <div class="form-group">
          <label for="contributeAmount">Amount (KES)</label>
          <input
            type="number"
            id="contributeAmount"
            placeholder="Enter amount"
            min="1"
            step="0.01"
            required
          />
        </div>
        <div class="form-group">
          <label for="contributeDescription">Description (Optional)</label>
          <textarea
            id="contributeDescription"
            rows="3"
            placeholder="Add a note about your contribution"
          ></textarea>
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end;">
          <button class="btn btn-secondary" onclick="closeContributeModal()">
            Cancel
          </button>
          <button class="btn" onclick="submitContribution()">
            <i class="fas fa-check"></i> Contribute
          </button>
        </div>
      </div>
    </div>

    <script src="/static/api-client.js"></script>
    <script>
      let communityId = null;

      // Get community ID from URL
      const urlParams = new URLSearchParams(window.location.search);
      communityId = urlParams.get("id");

      if (!communityId) {
        document.getElementById("communityName").textContent =
          "Community ID not found";
        showError("Community ID is required");
      }

      function isAuthenticated() {
        return !!localStorage.getItem("access_token");
      }

      function showError(message) {
        const msgEl = document.getElementById("message");
        msgEl.textContent = message;
        msgEl.className = "message error";
        msgEl.style.display = "block";
        setTimeout(() => {
          msgEl.style.display = "none";
        }, 5000);
      }

      function showSuccess(message) {
        const msgEl = document.getElementById("message");
        msgEl.textContent = message;
        msgEl.className = "message success";
        msgEl.style.display = "block";
        setTimeout(() => {
          msgEl.style.display = "none";
        }, 5000);
      }

      async function loadCommunity() {
        if (!isAuthenticated()) {
          window.location.href = "/static/auth.html";
          return;
        }

        if (!communityId) {
          showError("Community ID is required");
          return;
        }

        try {
          const community = await CommunityAPI.get(communityId);
          document.getElementById("communityName").textContent = community.name;
          document.getElementById(
            "campaignsLink"
          ).href = `/static/campaigns.html?community=${communityId}`;

          // Load stats
          await loadStats();
          await loadContributions();
        } catch (error) {
          console.error("Failed to load community:", error);
          showError(
            "Failed to load community: " + (error.message || "Unknown error")
          );
        }
      }

      async function loadStats() {
        try {
          // Get wallet balance if available
          const wallet = await WalletAPI.get();
          const contributions = await CommunityAPI.getContributions(communityId);

          const totalContributions = contributions.reduce(
            (sum, c) => sum + parseFloat(c.amount || 0),
            0
          );

          const statsGrid = document.getElementById("statsGrid");
          statsGrid.innerHTML = `
            <div class="stat-card">
              <div class="stat-value">KES ${parseFloat(
                wallet.balance || 0
              ).toLocaleString()}</div>
              <div class="stat-label">Your Wallet Balance</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">KES ${totalContributions.toLocaleString()}</div>
              <div class="stat-label">Total Contributions</div>
            </div>
            <div class="stat-card">
              <div class="stat-value">${contributions.length}</div>
              <div class="stat-label">Contribution Count</div>
            </div>
          `;
        } catch (error) {
          console.error("Failed to load stats:", error);
        }
      }

      async function loadContributions() {
        try {
          const contributions = await CommunityAPI.getContributions(communityId);
          const listEl = document.getElementById("contributionsList");

          if (contributions.length === 0) {
            listEl.innerHTML = `
              <p style="color: #718096; text-align: center; padding: 20px;">
                No contributions yet. Be the first to contribute!
              </p>
            `;
            return;
          }

          listEl.innerHTML = contributions
            .map(
              (c) => `
            <div style="background: #f7fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 4px solid #667eea;">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-weight: 600; color: #2d3748;">KES ${parseFloat(
                    c.amount || 0
                  ).toLocaleString()}</div>
                  <div style="color: #718096; font-size: 0.9rem; margin-top: 5px;">
                    ${c.description || "No description"}
                  </div>
                </div>
                <div style="color: #718096; font-size: 0.85rem;">
                  ${new Date(c.created_at).toLocaleDateString()}
                </div>
              </div>
            </div>
          `
            )
            .join("");
        } catch (error) {
          console.error("Failed to load contributions:", error);
          document.getElementById("contributionsList").innerHTML = `
            <p style="color: #dc3545; text-align: center; padding: 20px;">
              Failed to load contributions: ${error.message || "Unknown error"}
            </p>
          `;
        }
      }

      function openContributeModal() {
        if (!isAuthenticated()) {
          showError("Please log in to make a contribution");
          window.location.href = "/static/auth.html";
          return;
        }
        document.getElementById("contributeModal").style.display = "block";
        document.getElementById("contributeAmount").value = "";
        document.getElementById("contributeDescription").value = "";
        document.getElementById("contributeMessage").style.display = "none";
      }

      function closeContributeModal() {
        document.getElementById("contributeModal").style.display = "none";
      }

      async function submitContribution() {
        const amount = document.getElementById("contributeAmount").value;
        const description = document.getElementById("contributeDescription")
          .value;

        if (!amount || parseFloat(amount) <= 0) {
          showContributeMessage("Please enter a valid amount", "error");
          return;
        }

        try {
          const msgEl = document.getElementById("contributeMessage");
          msgEl.innerHTML =
            '<i class="fas fa-spinner fa-spin"></i> Processing contribution...';
          msgEl.className = "message";
          msgEl.style.display = "block";

          const result = await CommunityAPI.contribute(
            communityId,
            parseFloat(amount),
            description
          );

          if (result.success) {
            showContributeMessage("Contribution successful!", "success");
            setTimeout(() => {
              closeContributeModal();
              loadStats();
              loadContributions();
              showSuccess("Your contribution has been recorded!");
            }, 1500);
          } else {
            showContributeMessage(
              result.message || "Failed to make contribution",
              "error"
            );
          }
        } catch (error) {
          console.error("Contribution error:", error);
          showContributeMessage(
            "Failed to make contribution: " + (error.message || "Unknown error"),
            "error"
          );
        }
      }

      function showContributeMessage(message, type) {
        const msgEl = document.getElementById("contributeMessage");
        msgEl.textContent = message;
        msgEl.className = `message ${type}`;
        msgEl.style.display = "block";
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById("contributeModal");
        if (event.target == modal) {
          closeContributeModal();
        }
      };

      // Load community on page load
      document.addEventListener("DOMContentLoaded", function () {
        loadCommunity();
      });
    </script>
  </body>
</html>
