<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KingdomPay - Campaigns</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        color: #333;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border-radius: 25px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        padding: 12px 20px;
        border-radius: 15px;
        text-decoration: none;
        font-weight: 600;
      }

      .campaign-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 30px;
      }

      .campaign-card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 25px;
        padding: 30px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease;
      }

      .campaign-card:hover {
        transform: translateY(-8px);
      }

      .campaign-type {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 15px;
      }

      .type-tithes {
        background: #e6f3ff;
        color: #2a4365;
      }

      .type-offering {
        background: #fef5e7;
        color: #744210;
      }

      .type-donation {
        background: #c6f6d5;
        color: #22543d;
      }

      .progress-bar {
        width: 100%;
        height: 10px;
        background: #e2e8f0;
        border-radius: 5px;
        margin: 15px 0;
        overflow: hidden;
      }

      .progress-fill {
        height: 100%;
        background: linear-gradient(45deg, #667eea, #764ba2);
        border-radius: 5px;
        transition: width 0.5s ease;
      }

      @media (max-width: 768px) {
        .campaign-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="fas fa-bullhorn"></i> Active Campaigns</h1>
        <p>Support your communities through campaigns</p>
      </div>

      <div class="campaign-grid" id="campaignsGrid">
        <div style="text-align: center; padding: 40px; color: #718096">
          <i class="fas fa-spinner fa-spin" style="font-size: 3rem"></i>
          <p style="margin-top: 20px">Loading campaigns...</p>
        </div>
      </div>
    </div>

    <script src="/static/api-client.js"></script>
    <script>
      // For now, show placeholder campaigns
      // In production, this would load from the API
      const campaigns = [
        {
          id: 1,
          title: "Building Fund Drive",
          type: "TITHES",
          target_amount: 100000,
          current_amount: 45000,
          status: "ACTIVE",
        },
        {
          id: 2,
          title: "Youth Development",
          type: "DONATION",
          target_amount: 50000,
          current_amount: 32000,
          status: "ACTIVE",
        },
        {
          id: 3,
          title: "Monthly Offering",
          type: "OFFERING",
          target_amount: 20000,
          current_amount: 18500,
          status: "ACTIVE",
        },
      ];

      function displayCampaigns() {
        const grid = document.getElementById("campaignsGrid");

        grid.innerHTML = campaigns
          .map((campaign) => {
            const progress =
              (campaign.current_amount / campaign.target_amount) * 100;
            const typeClass = `type-${campaign.type.toLowerCase()}`;

            return `
            <div class="campaign-card">
              <div class="campaign-type ${typeClass}">${campaign.type}</div>
              <h2 style="font-size: 1.5rem; margin-bottom: 15px; color: #2d3748;">${
                campaign.title
              }</h2>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${Math.min(
                  progress,
                  100
                )}%"></div>
              </div>
              <div style="display: flex; justify-content: space-between; margin: 15px 0;">
                <div>
                  <div style="font-size: 1.8rem; font-weight: 700; color: #2d3748;">KES ${parseInt(
                    campaign.current_amount
                  ).toLocaleString()}</div>
                  <div style="color: #718096; font-size: 0.9rem;">Raised</div>
                </div>
                <div style="text-align: right;">
                  <div style="font-size: 1.8rem; font-weight: 700; color: #718096;">KES ${parseInt(
                    campaign.target_amount
                  ).toLocaleString()}</div>
                  <div style="color: #718096; font-size: 0.9rem;">Goal</div>
                </div>
              </div>
              <button class="btn btn-primary" onclick="contribute(${
                campaign.id
              })" style="width: 100%;">
                <i class="fas fa-hand-holding-heart"></i> Contribute Now
              </button>
            </div>
          `;
          })
          .join("");
      }

      function contribute(campaignId) {
        alert("Contribution feature will connect to API");
      }

      document.addEventListener("DOMContentLoaded", function () {
        displayCampaigns();
      });
    </script>

    <style>
      .btn {
        padding: 12px 24px;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
      }
    </style>
  </body>
</html>
