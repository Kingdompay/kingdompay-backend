services:
  - type: web
    name: kingdompay-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kingdompay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: kingdompay-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: RATELIMIT_STORAGE_URL
        fromService:
          type: redis
          name: kingdompay-redis
          property: connectionString

databases:
  - name: kingdompay-db
    plan: free
    databaseName: kingdompay
    user: kingdompay_user

  - name: kingdompay-redis
    type: redis
    plan: free
