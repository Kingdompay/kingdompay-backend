services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: kingdompay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: kingdompay
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d kingdompay"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kingdompay_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KingdomPay Backend Application
  backend:
    build: .
    container_name: kingdompay_backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - APP_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key-change-in-production}
      - DATABASE_URL=postgresql://admin:admin123@postgres:5432/kingdompay
      - REDIS_URL=redis://redis:6379/0
      - RATELIMIT_STORAGE_URL=redis://redis:6379/1
      - LOG_LEVEL=INFO
      # Provider webhooks (update BASE_URL in production)
      - BASE_URL=${BASE_URL:-http://localhost:5001}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - MPESA_CALLBACK_URL=${MPESA_CALLBACK_URL:-${BASE_URL}/api/v1/webhooks/provider/MPESA}
      - AIRTEL_CALLBACK_URL=${AIRTEL_CALLBACK_URL:-${BASE_URL}/api/v1/webhooks/provider/AIRTEL}
      - TKASH_CALLBACK_URL=${TKASH_CALLBACK_URL:-${BASE_URL}/api/v1/webhooks/provider/TKASH}
      # M-Pesa (Daraja)
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY:-}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET:-}
      - MPESA_PASSKEY=${MPESA_PASSKEY:-}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-}
      - MPESA_INITIATOR_NAME=${MPESA_INITIATOR_NAME:-}
      - MPESA_SECURITY_CREDENTIAL=${MPESA_SECURITY_CREDENTIAL:-}
      - MPESA_BASE_URL=${MPESA_BASE_URL:-https://sandbox.safaricom.co.ke}
      # Airtel Money
      - AIRTEL_CLIENT_ID=${AIRTEL_CLIENT_ID:-}
      - AIRTEL_CLIENT_SECRET=${AIRTEL_CLIENT_SECRET:-}
      - AIRTEL_BASE_URL=${AIRTEL_BASE_URL:-https://openapiuat.airtel.africa}
      # T-Kash
      - TKASH_API_KEY=${TKASH_API_KEY:-}
      - TKASH_API_SECRET=${TKASH_API_SECRET:-}
      - TKASH_MERCHANT_ID=${TKASH_MERCHANT_ID:-}
      - TKASH_BASE_URL=${TKASH_BASE_URL:-https://api.t-kash.co.ke}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./static:/app/static
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PgAdmin (Optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: kingdompay_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@kingdompay.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

  # Redis Commander (Optional - for Redis management)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: kingdompay_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379:0
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: kingdompay_network
